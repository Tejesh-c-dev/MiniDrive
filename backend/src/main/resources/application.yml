spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: minidrive

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
  expiration: 86400000
server:
  port: 8080
