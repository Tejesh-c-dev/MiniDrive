services:

  postgres:
    image: postgres:16
    container_name: minidrive-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minidrive}
      POSTGRES_USER: ${POSTGRES_USER:-minidrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minidrive}

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minidrive -d minidrive"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: