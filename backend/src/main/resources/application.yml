spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: minidrive

  # Redis cache infrastructure (Phase 10.2). The cache TTL, key prefix,
  # null-value policy and JSON serialization live in CacheConfig. Caching
  # is connect-only: the backend starts without a running Redis and only
  # reaches it when a cache operation is first attempted.
  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

logging:
  structured:
    format:
      console: ecs

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: never
      group:
        database:
          include: db
        cache:
          include: redis
    prometheus:
      access: read-only
  metrics:
    tags:
      application: minidrive
    export:
      prometheus:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:minidrive-files}

minidrive:
  cleanup-journal:
    directory: ${MINIDRIVE_CLEANUP_JOURNAL_DIR:./data/cleanup-journal}
    retry-delay-ms: ${MINIDRIVE_CLEANUP_JOURNAL_RETRY_DELAY_MS:30000}
    initial-delay-ms: ${MINIDRIVE_CLEANUP_JOURNAL_INITIAL_DELAY_MS:30000}
  storage:
    replication:
      enabled: ${MINIDRIVE_REPLICATION_ENABLED:false}
      # One-shot, explicit operator mode. Keep replication disabled while running.
      backfill: ${MINIDRIVE_REPLICATION_BACKFILL:false}
      primary-node-id: ${MINIDRIVE_PRIMARY_NODE_ID:primary}
      repair-delay-ms: ${MINIDRIVE_REPAIR_DELAY_MS:30000}
    nodes:
      - id: primary
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
        bucket: ${MINIO_BUCKET:minidrive-files}
        enabled: ${MINIO_PRIMARY_ENABLED:true}
      - id: secondary
        endpoint: ${MINIO_SECONDARY_ENDPOINT:http://localhost:9100}
        access-key: ${MINIO_SECONDARY_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECONDARY_SECRET_KEY:minioadmin}
        bucket: ${MINIO_SECONDARY_BUCKET:minidrive-files-secondary}
        enabled: ${MINIO_SECONDARY_ENABLED:false}
